name: Fetch golem logs

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
    inputs:
      since_date:
        description: "Optional: also fetch older logs uploaded on or after this date (YYYY-MM-DD)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: fetch-golem-logs
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Download new golem logs from dps.report
        shell: python3 {0}
        env:
          DPS_TOKEN: ${{ secrets.DPS_REPORT_TOKEN }}
          SINCE_DATE: ${{ github.event.inputs.since_date }}
        run: |
          import gzip, json, os, sys, time, urllib.error, urllib.request
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo

          TZ = ZoneInfo("America/Chicago")
          TOKEN = os.environ.get("DPS_TOKEN", "").strip()
          if not TOKEN:
              sys.exit("The DPS_REPORT_TOKEN secret is missing (Settings > Secrets and variables > Actions).")
          UA = "gw2-golem-log-relay/1.0 (GitHub Actions, personal practice logs)"
          MAX_PER_RUN = 60
          SPECS = {7: "Daredevil", 40: "Chronomancer", 43: "Scrapper", 55: "Soulbeast",
                   59: "Mirage", 71: "Specter", 75: "Amalgam", 77: "Antiquary"}

          def get(url, tries=4):
              last = "unknown error"
              for i in range(tries):
                  try:
                      req = urllib.request.Request(url, headers={"User-Agent": UA, "Accept": "application/json"})
                      with urllib.request.urlopen(req, timeout=120) as r:
                          return r.read()
                  except urllib.error.HTTPError as e:
                      last = f"HTTP {e.code}"   # never print the URL: it can hold the token
                      if e.code not in (429, 500, 502, 503, 504):
                          break
                  except Exception as e:
                      last = type(e).__name__
                  time.sleep(5 * (i + 1))
              raise RuntimeError(last)

          def list_uploads(since):
              for host in ("b.dps.report", "a.dps.report", "dps.report"):
                  out, page = [], 1
                  try:
                      while True:
                          data = json.loads(get(f"https://{host}/getUploads?userToken={TOKEN}"
                                                f"&perPage=100&page={page}&since={since}"))
                          ups = data.get("uploads") or []
                          if any(u["uploadTime"] < since for u in ups):
                              raise RuntimeError("stale cached response")
                          out += ups
                          if page >= (data.get("pages") or 1):
                              return out
                          page += 1
                  except Exception as e:
                      print(f"Upload list via {host} failed: {e}")
              sys.exit("Could not read the upload list from dps.report.")

          state_p, index_p = Path("state.json"), Path("index.json")
          state = json.loads(state_p.read_text()) if state_p.exists() else {}
          index = json.loads(index_p.read_text()) if index_p.exists() else {"logs": []}
          have = {e["id"] for e in index["logs"]}

          since_date = os.environ.get("SINCE_DATE", "").strip()
          if since_date:
              since = int(datetime.strptime(since_date, "%Y-%m-%d").replace(tzinfo=TZ).timestamp())
          elif "since" in state:
              since = state["since"]
          else:  # first run: start from the beginning of today
              since = int(datetime.now(TZ).replace(hour=0, minute=0, second=0, microsecond=0).timestamp())

          uploads = list_uploads(since)
          golems = sorted((u for u in uploads
                           if "golem" in ((u.get("encounter") or {}).get("boss") or "").lower()
                           and len(u.get("players") or {}) == 1 and u["id"] not in have),
                          key=lambda u: u["uploadTime"])
          print(f"{len(uploads)} uploads since {since}; {len(golems)} new golem logs.")

          saved, total, failed = 0, 0, False
          for u in golems[:MAX_PER_RUN]:
              try:
                  raw = get(f"https://dps.report/getJson?id={u['id']}")
                  if "players" not in json.loads(raw):
                      raise RuntimeError("response was not an Elite Insights log")
              except Exception as e:
                  print(f"{u['id']}: download failed ({e}); it will be retried next run.")
                  failed = True
                  break
              e, p = u["encounter"], next(iter(u["players"].values()))
              when = datetime.fromtimestamp(u["encounterTime"], TZ)
              rel = f"logs/{when:%Y-%m-%d}/{u['id']}.json.gz"
              Path(rel).parent.mkdir(parents=True, exist_ok=True)
              Path(rel).write_bytes(gzip.compress(raw, 9, mtime=0))
              index["logs"].append({
                  "id": u["id"], "local": f"{when:%Y-%m-%d %H:%M}", "encounterTime": u["encounterTime"],
                  "uploadTime": u["uploadTime"], "boss": e.get("boss"), "bossId": e.get("bossId"),
                  "success": bool(e.get("success")), "duration": e.get("duration"), "dps": e.get("compDps"),
                  "spec": SPECS.get(p.get("elite_spec"), p.get("elite_spec")), "gw2Build": e.get("gw2Build"),
                  "file": rel, "jsonBytes": len(raw)})
              state["since"] = u["uploadTime"]
              saved += 1
              total += Path(rel).stat().st_size
              print(f"Saved {rel} ({len(raw) // 1024} KB JSON, {Path(rel).stat().st_size // 1024} KB stored)")
              time.sleep(2)

          if not failed and saved == len(golems) and uploads:
              state["since"] = max(u["uploadTime"] for u in uploads)
          index["logs"].sort(key=lambda x: x["encounterTime"])
          index_p.write_text(json.dumps(index, indent=1) + "\n")
          state_p.write_text(json.dumps(state) + "\n")
          print(f"Done: {saved} saved ({total // 1024} KB), {len(golems) - saved} left for the next run.")
          if failed and saved == 0:
              sys.exit(1)

      - name: Commit new logs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "Nothing new to commit."; exit 0; fi
          git commit -q -m "Add golem logs $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull -q --rebase
          git push -q
